name: Update Inno Setup

on:
  schedule:
    - cron: "0 3 1 * *"   # 1-го числа каждого месяца в 03:00 UTC (06:00 по Москве)
  workflow_dispatch:
    inputs:
      force:
        description: 'Пересобрать релиз даже без новой версии Inno Setup'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: inno-setup-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Определить последнюю стабильную версию
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/jrsoftware/issrc/releases/latest --jq .tag_name)
          VER=$(echo "$TAG" | sed 's/^is-//; s/_/./g')
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VER"      >> "$GITHUB_OUTPUT"

      - name: Сравнить с текущей версией
        id: check
        shell: bash
        run: |
          VER="${{ steps.latest.outputs.version }}"
          CUR=$(cat .inno-setup-version 2>/dev/null || echo "0")
          FORCE="${{ github.event.inputs.force }}"
          if [ "$VER" = "$CUR" ] && [ "$FORCE" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "Текущая: $CUR, новая: $VER (force: $FORCE)"
          fi

      - name: Скачать оба установщика
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "${{ steps.latest.outputs.tag }}" \
            --repo jrsoftware/issrc \
            --pattern 'innosetup-*-x86.exe' \
            --pattern 'innosetup-*-x64.exe'

      - name: Тихая установка x86 и x64
        if: steps.check.outputs.changed == 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE\out"

          $installers = @(
            @{ Exe = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Filter 'innosetup-*-x86.exe' | Select-Object -First 1).FullName; Dir = "$out\x86"; Log = 'install-x86.log' }
            @{ Exe = (Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Filter 'innosetup-*-x64.exe' | Select-Object -First 1).FullName; Dir = "$out\x64"; Log = 'install-x64.log' }
          )

          foreach ($i in $installers) {
            $setupArgs = @(
              '/SP-'
              '/VERYSILENT'
              '/SUPPRESSMSGBOXES'
              '/NORESTART'
              '/LOG=' + "$env:GITHUB_WORKSPACE\$($i.Log)"
              '/DIR=' + $i.Dir
            )
            Write-Host "Запуск: $($i.Exe) $($setupArgs -join ' ')"
            $p = Start-Process -FilePath $i.Exe -ArgumentList $setupArgs -Wait -PassThru
            Write-Host "Код возврата: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) {
              Write-Host "=== Последние строки лога установки ==="
              Get-Content "$env:GITHUB_WORKSPACE\$($i.Log)" -Tail 40
              exit 1
            }
          }

      - name: Обновить bin
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          rm -rf bin/x86 bin/x64
          mkdir -p bin/x86 bin/x64
          cp -r out/x86/. bin/x86/
          cp -r out/x64/. bin/x64/
          # убираем Examples и деинсталляторы
          rm -rf bin/x86/Examples bin/x64/Examples
          find bin/x86 bin/x64 -type f -name 'unins*.*' -delete
          echo "${{ steps.latest.outputs.version }}" > .inno-setup-version

      - name: Проверить наличие компилятора
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          test -f bin/x86/ISCC.exe || { echo "ISCC.exe (x86) не найден!"; exit 1; }
          test -f bin/x64/ISCC.exe || { echo "ISCC.exe (x64) не найден!"; exit 1; }

      - name: Коммит и пуш
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin .inno-setup-version
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
            exit 0
          fi
          git commit -m "chore: update Inno Setup to ${{ steps.latest.outputs.version }}"
          git push

      - name: Вычислить тег и создать релиз
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.latest.outputs.version }}"
          TITLE="Node innosetup-compiller"

          # последний наш релиз: тег вида 7.1.0 или 7.1.0_2
          PREV=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' | grep -E "^[0-9]+\.[0-9]+\.[0-9]+(_[0-9]+)?$" | head -1 || true)

          # срезаем суффикс _N, оставляем только базовую версию
          BASE=$(echo "$PREV" | sed 's/_[0-9]*$//')

          if [ "$BASE" != "$VER" ]; then
            # новая версия Inno Setup — начинаем с чистого тега
            NEW_TAG="$VER"
          else
            # база та же — наращиваем суффикс собственных правок
            case "$PREV" in
              *_*) SUFFIX="${PREV##*_}"; NEW_TAG="${VER}_$((SUFFIX+1))" ;;
              *)   NEW_TAG="${VER}_1" ;;
            esac
          fi
          echo "Прошлый тег: ${PREV:-нет} → новый: $NEW_TAG"

          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Релиз $NEW_TAG уже существует, пропускаем"
            exit 0
          fi

          gh release create "$NEW_TAG" \
            --title "$TITLE v$NEW_TAG" \
            --notes "Компилятор Inno Setup: $VER.

          Источник: jrsoftware/issrc, релиз \`${{ steps.latest.outputs.tag }}\`.
          Обновлены файлы в bin/x86 и bin/x64."
